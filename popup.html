<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="weblogo.png">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Capriola&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* ========================================================= */
        /* HEADER VE MENÜ STİLLERİ (SABİT, BEYAZ/SİYAH, BLURLU) */
        /* ========================================================= */
        #main-header {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            z-index: 1002;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Dış alan tıklamaları engellememesi için */
        }

        .header-left, #desktop-nav, #mobile-nav-container {
            pointer-events: auto;
        }

        .header-left {
            position: absolute;
            left: 20px;
            top: 0;
        }

        .side-logo {
            width: 40px;
            height: auto;
            transition: transform 0.3s ease;
        }

        .side-logo:hover {
            transform: scale(1.05);
        }

        #desktop-nav {
            display: flex;
            flex-direction: row;
            justify-content: center;
            flex-wrap: nowrap;
            gap: 6px;
        }

        .info-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.6); /* Beyaz arkaplan */
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid #000000; /* Siyah kenarlık */
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            line-height: normal;
            color: #000000; /* Siyah metin */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
            flex-shrink: 1;
        }

        .info-btn:hover {
            background: rgba(0, 0, 0, 0.1); 
            border-color: #000000;
            transform: none;
            box-shadow: none;
        }

        .info-btn.active {
            background: transparent;
            border-color: #000000;
            color: #000000;
            font-weight: 700;
        }

        #mobile-nav-container {
            display: none;
            position: absolute;
            right: 20px;
            top: 0;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        #mobile-menu-items {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
        }

        #mobile-menu-items.open {
            display: flex;
        }

        #mobile-menu-items .info-btn {
            width: 80px;
            justify-content: center;
        }

        @media (max-width: 768px) {
            #main-header {
                top: 12px;
                padding: 0 12px;
            }
            .header-left {
                left: 12px;
            }
            #desktop-nav {
                display: none;
            }
            #mobile-nav-container {
                display: flex;
                right: 12px;
            }
            .side-logo {
                width: 32px;
            }
            .info-btn {
                padding: clamp(4px, 1.5vw, 8px) clamp(5px, 2vw, 10px);
                font-size: clamp(5px, 1.8vw, 7px);
                flex-shrink: 1;
                min-width: 0;
            }
            #mobile-menu-items .info-btn {
                width: 80px;
            }
        }

        /* ========================================================= */
        /* FOOTER STILLERI (BİREBİR BOYUTLAR, SİYAH RENKLER) */
        /* ========================================================= */
        #footer {
            position: fixed;
            bottom: 4px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 60; 
            padding: 0 20px;
            font-family: 'Space Mono', monospace;
            pointer-events: none; 
        }

        .footer-social, .footer-right {
            pointer-events: auto;
        }

        .footer-social {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-social a {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            text-decoration: none;
        }

        .footer-social a:hover {
            opacity: 0.6;
        }

        .footer-social svg {
            width: 16px;
            height: 16px;
            fill: #000000; /* İkonlar siyah */
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 8px;
            color: #000000; /* Metin siyah */
            opacity: 0.8;
        }

        .footer-copyright {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .footer-terms {
            color: #000000; /* Metin siyah */
            text-decoration: underline;
        }

        .footer-terms:hover {
            opacity: 1;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #footer {
                bottom: 4px;
                padding: 0 12px;
            }
            .footer-social svg {
                width: 14px;
                height: 14px;
            }
            .footer-right {
                font-size: 6px;
                gap: 8px;
            }
        }


/* --- MOBILE BANNER (Arka Plan) --- */
        .header-bg {
            position: relative;
            background-color: #ffffff; /* Information açılınca alt tarafın bembeyaz ve temiz kalmasını sağlar */
            background-image: url('https://raw.githubusercontent.com/decentralize-dfw/co-contemporaryartifacts-glb/main/mobile-header-popup.jpg');
            background-size: 100% auto; /* Görseli yanlardan tam oturtur (fit eder), aşağısını serbest bırakır */
            background-position: top center; /* Görseli en tepeye sabitler */
            background-repeat: no-repeat;
        }

        /* --- DESKTOP BANNER & LOGO (1024px+) --- */
        @media (min-width: 1024px) {
            .header-bg {
                position: relative;
                background-image: url('https://raw.githubusercontent.com/decentralize-dfw/co-contemporaryartifacts-glb/main/productsbanner-pop-up.png');
                background-size: cover;
                background-position: 25.43% 60.16%;
                background-repeat: no-repeat;
                aspect-ratio: 2556 / 748;
                max-height: 75vh;
            }
            .logo-desktop-shift {
                position: absolute;
                left: 19%;
                top: 50%;
                transform: translate(-50%, -50%);
                z-index: 10;
                width: 10%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
        }

        .logo-desktop-shift img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* --- TYPOGRAPHY --- */
        .font-header { font-family: 'Capriola', sans-serif; }
        .font-body { 
            font-family: 'Space Mono', monospace; 
            letter-spacing: -0.2px;
            line-height: 1.2;
        }

        /* --- GRID SYSTEM --- */
        .dynamic-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            transition: opacity 0.4s ease-in-out;
        }

        @media (min-width: 1024px) { 
            .dynamic-grid { 
                gap: 3rem;
                grid-template-columns: repeat(5, minmax(0, 1fr)); 
            } 
        }

        /* --- UI COMPONENTS --- */
        .aspect-square-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex; 
            align-items: center; /* KARENİN TAM ORTASI İÇİN */
            justify-content: center;
            overflow: hidden; 
            background-color: transparent;
        }

        .fit-image { 
            /* Object fit contain katsayıyla % scale edilince tam sığmayı sağlar */
            object-fit: contain; 
        }

        #loading-overlay {
            position: fixed; inset: 0; background: white; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }

        #detail-modal-overlay {
            position: fixed; inset: 0;
            background-color: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            z-index: 10000; display: none; overflow: hidden;
        }

        #detail-modal {
            width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .glass-panel {
            background-color: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #000; }

        #header-description-container {
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.3s ease; opacity: 0;
            width: 100%;
        }
        @media (min-width: 1024px) { 
            #header-description-container { max-height: none !important; opacity: 1 !important; display: block !important; margin-top: 1rem; }
        }

        #header-description-container.open { max-height: 2000px; opacity: 1; margin-top: 1rem; }

        .filter-btn {
            font-family: 'Space Mono', monospace; 
            font-size: clamp(6px, 2vw, 10px);
            text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer;
            transition: all 0.2s ease; color: #000;
            white-space: nowrap;
        }
        @media (min-width: 1024px) { 
            .filter-btn { font-size: 10px; letter-spacing: 0.1em; }
        }
        .filter-btn.active { border: 1px solid #000; padding: 2px 6px; color: #9ca3af; }
        @media (min-width: 1024px) { .filter-btn.active { padding: 4px 12px; } }

        .fade-out { opacity: 0; }

        /* --- IMAGE CAROUSEL & MODAL IMAGE SETTINGS --- */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .carousel-main-area {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-image-wrapper {
            width: 80vw;
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: pan-y pinch-zoom;
        }

        .carousel-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; 
        }

        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 30px; /* Ufaldı */
            height: 30px; /* Ufaldı */
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: rgba(0,0,0,0.5);
            z-index: 10;
        }

        .carousel-arrow:hover {
            background: #fff;
            border-color: rgba(0,0,0,0.2);
            color: rgba(0,0,0,0.8);
        }

        /* Ekrana yapışmaması için boşluk bırakıldı */
        .carousel-arrow.prev { left: 20px; }
        .carousel-arrow.next { right: 20px; }

        .carousel-arrow svg {
            width: 16px;
            height: 16px;
            stroke-width: 2;
        }

        .carousel-arrow.hidden { display: none; }

        .carousel-thumbnails {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 2vh;
            width: 90%;
        }

        @media (min-width: 1024px) {
            .carousel-thumbnails.show { display: flex; position: absolute; bottom: 20px; }
            /* Desktop'ta da kenardan biraz daha içeride dursun */
            .carousel-arrow.prev { left: 40px; }
            .carousel-arrow.next { right: 40px; }
        }

        .carousel-thumb {
            width: 20px;
            height: 20px;
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid transparent;
            opacity: 0.4;
            transition: all 0.2s ease;
        }

        .carousel-thumb:hover { opacity: 0.7; }
        .carousel-thumb.active { border-color: #000; opacity: 1; }
        .carousel-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .carousel-mobile-dots {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 6px;
            position: absolute;
            bottom: 20px;
            width: 100%;
        }

        @media (max-width: 1023px) {
            .carousel-mobile-dots.show { display: flex; }
        }

        .carousel-dot {
            width: 5px;
            height: 5px;
            border-radius: 1px;
            background-color: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .carousel-dot:hover { background-color: rgba(0, 0, 0, 0.4); }
        .carousel-dot.active { background-color: rgba(0, 0, 0, 0.7); }

        /* --- DESKTOP LANGUAGE TOGGLE BUTTON (ESKI YERİNDE: RIGHT 20PX, TOP 20PX) --- */
        .lang-toggle-desktop {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999; /* Yükleme ekranının altında kalır */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid #000000;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        
        /* --- DESKTOP BANNER: DİKEY ORTALAMA (TAILWIND OVERRIDE) --- */
        @media (min-width: 1024px) {
            .popup-outer-div {
                display: block !important;
                height: 100% !important;
                min-height: 0 !important;
                padding: 0 !important;
            }
            .popup-header-inner {
                height: 100% !important;
            }
        }

        /* --- GRID: KARE CROP, ALT-ORTA SABITLEME --- */
        .aspect-square-container {
            align-items: flex-end !important;
        }
        .fit-image {
            object-fit: cover !important;
            object-position: center bottom !important;
            flex-shrink: 0 !important;
        }

       /* --- ITEM NAV ARROWS --- */
        .item-nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1200;
            width: 22px;
            height: 44px;
            background: transparent; /* Siyah arkaplan kaldırıldı */
            border: none;
            color: #000000; /* Oklar siyah yapıldı */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 3px;
            transition: opacity 0.2s;
            padding: 0;
        }
        .item-nav-arrow:hover { opacity: 0.5; }
        .item-nav-arrow.item-prev { left: 8px; }
        .item-nav-arrow.item-next { right: 8px; }
        .item-nav-arrow.hidden { display: none !important; }
        .item-nav-arrow svg { width: 22px; height: 22px; stroke-width: 2.5; }
        
        /* Masaüstünde okları merkeze yaklaştırma */
        @media (min-width: 1024px) {
            .item-nav-arrow.item-prev { left: 40px; }
            .item-nav-arrow.item-next { right: 40px; }
        }

        /* Desktop Hover iptali */
        .lang-toggle-desktop:hover {
            border-color: #000000;
        }
    </style>
</head>

            </a>
            <a href="https://instagram.com/status.co" target="_blank" title="Instagram">
                <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8C4 18.39 5.61 20 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6C20 5.61 18.39 4 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 17.25 8 1.25 1.25 0 0 1 16 6.75a1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1 5-5m0 2a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>
            </a>
        </div>
        <div class="footer-right">
            <span class="footer-copyright">ALL RIGHTS RESERVED © STATUS CO 2026</span>
            <a href="https://status-co.com/terms-conditions" class="footer-terms">TERMS AND CONDITIONS</a>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="detail-modal-overlay">
        <!-- SOL ALT KÖŞEDE ÇOK UFAK MESAFELİ 6PX KOD (YENİ EKLENDİ - BOTTOM-2 LEFT-2 - BOLD YOK) -->
        <div id="modal-drop-code" class="absolute bottom-2 left-2 lg:bottom-4 lg:left-4 z-[1100] text-[6px] font-body uppercase text-black tracking-wider"></div>

        <!-- ITEM NAV ARROWS (öğeler arası geçiş, filtre hassas) -->
        <button id="item-prev-btn" class="item-nav-arrow item-prev hidden" onclick="window.prevItem()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button id="item-next-btn" class="item-nav-arrow item-next hidden" onclick="window.nextItem()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>

        <button id="close-modal" class="absolute top-6 left-6 lg:top-8 lg:left-8 z-[1100] p-2 hover:bg-black hover:text-white transition-all rounded-full bg-white/90 border border-gray-100 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <div id="detail-modal" class="glass-panel">
            <div class="carousel-container">
                <div class="carousel-main-area">
                    <button id="carousel-prev" class="carousel-arrow prev hidden" onclick="window.carouselPrev()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <div id="carousel-image-wrapper" class="carousel-image-wrapper">
                        <img id="modal-image" src="" alt="" class="transition-opacity duration-300">
                    </div>
                    <button id="carousel-next" class="carousel-arrow next hidden" onclick="window.carouselNext()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
                <div id="carousel-thumbnails" class="carousel-thumbnails"></div>
                <div id="carousel-mobile-dots" class="carousel-mobile-dots"></div>
            </div>
        </div>
    </div>

    <script type="module">
        // =========================================================
        // MOBİL MENÜ MANTIĞI (Açma / Kapama)
        // =========================================================
        const menuToggle = document.getElementById('menu-toggle');
        const menuItems = document.getElementById('mobile-menu-items');
        
        function closeMenu() {
            if(menuItems.classList.contains('open')) {
                menuItems.classList.remove('open');
                menuToggle.textContent = 'MENU';
            }
        }

        menuToggle.addEventListener('click', () => {
            const isOpen = menuItems.classList.toggle('open');
            menuToggle.textContent = isOpen ? 'CLOSE' : 'MENU';
        });

        // =========================================================
        // VERİ ÇEKME & LİSTELEME MANTIĞI 
        // =========================================================
        const LOCAL_EXCEL_PATH = 'CO-POPUP-PNG.xlsx';

        let artifacts = [];
        let filteredArtifacts = [];
        let currentCategory = ''; 
        let isInfoOpen = false;
        let currentLang = 'en'; 
        let sheetRows = null; 
        let currentModalDropCode = null; 
        let currentCarouselImages = []; 
        let currentCarouselIndex = 0; 

        // Sütun İndeksleri (Türkçe Kategori: G Sütunu -> 6)
        const TR_COLUMNS = {
            artworkName: 38, category: 6, productType: 40, color: 41, material: 42,
            description: 20, artistBio: 24, headerDesc: 3, price: 43
        };
        const EN_COLUMNS = {
            artworkName: 3, category: 5, productType: 6, color: 7, material: 8,
            description: 18, artistBio: 23, headerDesc: 2, price: 16
        };

        const TR_LABELS = { siteTitle: 'POP UP 001: ARTSHOW', information: 'Bilgi', categoryLabel: 'Kategori:', allCategory: 'Tümü' };
        const EN_LABELS = { siteTitle: 'POP UP 001: ARTSHOW', information: 'Information', categoryLabel: 'Category:', allCategory: 'All' };

        function getLabels() {
            return currentLang === 'tr' ? TR_LABELS : EN_LABELS;
        }

        function nl2br(str) {
            if (!str) return str;
            return str.replace(/\\n|\n/g, '<br>');
        }

        window.toggleLanguage = function() {
            const btnDesktop = document.getElementById('lang-toggle-desktop');
            const btnMobile = document.getElementById('lang-toggle-mobile');

            if (currentLang === 'en') {
                currentLang = 'tr';
                if(btnDesktop) btnDesktop.innerText = 'ENG';
                if(btnMobile) btnMobile.innerText = 'ENG';
            } else {
                currentLang = 'en';
                if(btnDesktop) btnDesktop.innerText = 'TR';
                if(btnMobile) btnMobile.innerText = 'TR';
            }

            processSheetData();
            setupFilters();
            renderContent();

            if (currentModalDropCode && document.getElementById('detail-modal-overlay').style.display === 'block') {
                window.openDetail(currentModalDropCode);
            }
        };

        window.toggleInfo = function() {
            const container = document.getElementById('header-description-container');
            const icon = document.getElementById('info-icon');
            isInfoOpen = !isInfoOpen;
            if (isInfoOpen) { container.classList.add('open'); icon.innerText = '-'; }
            else { container.classList.remove('open'); icon.innerText = '+'; }
        };

        function processSheetData() {
            if (!sheetRows) return;

            const cols = currentLang === 'tr' ? TR_COLUMNS : EN_COLUMNS;
            const labels = getLabels();

            document.getElementById('site-title').innerText = labels.siteTitle;
            document.getElementById('info-btn-text').innerText = labels.information;
            document.getElementById('category-label').innerText = labels.categoryLabel;

            const headerRow = currentLang === 'tr' ? 1 : 0;
            const headerCol = 2; // C column
            if (sheetRows[headerRow] && sheetRows[headerRow].c[headerCol] && sheetRows[headerRow].c[headerCol].v) {
                document.getElementById('header-description').innerHTML = nl2br(String(sheetRows[headerRow].c[headerCol].v));
            }

            artifacts = sheetRows.map(row => {
                const c = row.c;
                const val = (idx) => (c[idx] && c[idx].v !== null && c[idx].v !== "null") ? String(c[idx].v) : "";
                const rawScale = (c[26] && c[26].v !== null) ? parseFloat(c[26].v) : 1;
                const thumbScale = isNaN(rawScale) ? 1 : rawScale;

                const allImages = [val(11), val(34), val(35), val(36)].filter(img => img !== "");

                return {
                    dropCode: val(1),
                    artworkName: val(cols.artworkName), 
                    category: val(cols.category),     
                    imageLink: val(11),
                    images: allImages,
                    thumbnail: val(13),
                    thumbScale: thumbScale
                };
            }).filter(i => i.dropCode && i.dropCode.includes("CA_"));

            currentCategory = labels.allCategory;
            filteredArtifacts = artifacts;
        }

        async function fetchSheetData() {
            try {
                const response = await fetch(LOCAL_EXCEL_PATH);
                const arrayBuffer = await response.arrayBuffer();

                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];

                const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: null });

                sheetRows = rawData.map(row => {
                    return {
                        c: row.map(cell => {
                            return (cell !== null && cell !== undefined) ? { v: cell } : null;
                        })
                    };
                });

                processSheetData();
                setupFilters();
                renderContent();
                document.getElementById('loading-overlay').style.display = 'none';
            } catch (error) { console.error(error); }
        }

        function setupFilters() {
            const labels = getLabels();
            const categories = [labels.allCategory, ...new Set(artifacts.map(i => i.category))].filter(c => c);
            
            document.getElementById('filter-list').innerHTML = categories.map(cat => `
                <button onclick="applyFilter('${cat}')" class="filter-btn ${currentCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</button>
            `).join('');
        }

        window.applyFilter = function(cat) {
            const container = document.getElementById('main-container');
            const labels = getLabels();
            
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                if (btn.dataset.cat === cat) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            container.classList.add('fade-out');
            setTimeout(() => {
                currentCategory = cat;
                filteredArtifacts = cat === labels.allCategory ? artifacts : artifacts.filter(i => i.category === cat);
                renderContent(); 
                container.classList.remove('fade-out');
            }, 300);
        };

        function renderContent() {
            const container = document.getElementById('main-container');
            const newHTML = `<div class="dynamic-grid">${filteredArtifacts.map(renderGridItem).join('')}</div>`;
            
            
            if (container.innerHTML !== newHTML) {
                container.innerHTML = newHTML;
            }
        }

        function renderGridItem(item) {
            const scalePct = item.thumbScale * 100;
            return `
                <div onclick="window.openDetail('${item.dropCode}')" class="cursor-pointer flex flex-col items-center justify-center">
                    <div class="aspect-square-container overflow-hidden">
                        <img src="${item.thumbnail}" loading="lazy" 
                             style="width: ${scalePct}%; height: ${scalePct}%;" 
                             class="fit-image">
                    </div>
                    <!-- SADECE DESKTOP, SOL ALTTA 6PX KOD (KATEGORİSİZ, BOLD İPTAL) -->
                    <div class="w-full mt-1 px-1 hidden lg:flex justify-start">
                        <span class="font-body text-[6px] uppercase tracking-wider text-black">${item.dropCode}</span>
                    </div>
                </div>
            `;
        }

        function updateItemNavButtons() {
            const idx = filteredArtifacts.findIndex(a => a.dropCode === currentModalDropCode);
            const prevBtn = document.getElementById('item-prev-btn');
            const nextBtn = document.getElementById('item-next-btn');
            if (prevBtn) prevBtn.classList.toggle('hidden', idx <= 0);
            if (nextBtn) nextBtn.classList.toggle('hidden', idx >= filteredArtifacts.length - 1);
        }

        window.prevItem = function() {
            const idx = filteredArtifacts.findIndex(a => a.dropCode === currentModalDropCode);
            if (idx > 0) window.openDetail(filteredArtifacts[idx - 1].dropCode);
        };

        window.nextItem = function() {
            const idx = filteredArtifacts.findIndex(a => a.dropCode === currentModalDropCode);
            if (idx < filteredArtifacts.length - 1) window.openDetail(filteredArtifacts[idx + 1].dropCode);
        };

        window.openDetail = function(dropCode) {
            currentModalDropCode = dropCode;
            const item = artifacts.find(a => a.dropCode === dropCode);

            // Pop-up sol alt kod güncellemesi
            document.getElementById('modal-drop-code').innerText = item.dropCode;

            currentCarouselImages = item.images && item.images.length > 0 ? item.images : [item.imageLink];
            currentCarouselIndex = 0;
            updateCarouselDisplay();
            updateItemNavButtons();

            document.getElementById('detail-modal-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        };

        function updateCarouselDisplay() {
            const modalImage = document.getElementById('modal-image');
            const thumbsContainer = document.getElementById('carousel-thumbnails');
            const mobileDotsContainer = document.getElementById('carousel-mobile-dots');
            const prevBtn = document.getElementById('carousel-prev');
            const nextBtn = document.getElementById('carousel-next');

            const currentImage = currentCarouselImages[currentCarouselIndex];
            const hasMultipleImages = currentCarouselImages.length > 1;
            const isFirst = currentCarouselIndex === 0;
            const isLast = currentCarouselIndex === currentCarouselImages.length - 1;

            if (modalImage) modalImage.src = currentImage;

            if (prevBtn) {
                prevBtn.classList.toggle('hidden', !hasMultipleImages || isFirst);
            }
            if (nextBtn) {
                nextBtn.classList.toggle('hidden', !hasMultipleImages || isLast);
            }

            if (hasMultipleImages) {
                thumbsContainer.classList.add('show');
                thumbsContainer.innerHTML = currentCarouselImages.map((img, idx) => `
                    <div class="carousel-thumb ${idx === currentCarouselIndex ? 'active' : ''}" onclick="window.carouselGoTo(${idx})">
                        <img src="${img}" alt="Thumbnail ${idx + 1}">
                    </div>
                `).join('');
            } else {
                thumbsContainer.classList.remove('show');
                thumbsContainer.innerHTML = '';
            }

            if (hasMultipleImages) {
                mobileDotsContainer.classList.add('show');
                mobileDotsContainer.innerHTML = currentCarouselImages.map((img, idx) => `
                    <div class="carousel-dot ${idx === currentCarouselIndex ? 'active' : ''}" onclick="window.carouselGoTo(${idx})"></div>
                `).join('');
            } else {
                mobileDotsContainer.classList.remove('show');
                mobileDotsContainer.innerHTML = '';
            }
        }

        window.carouselNext = function() {
            if (currentCarouselIndex < currentCarouselImages.length - 1) {
                currentCarouselIndex++;
                updateCarouselDisplay();
            }
        };

        window.carouselPrev = function() {
            if (currentCarouselIndex > 0) {
                currentCarouselIndex--;
                updateCarouselDisplay();
            }
        };

        window.carouselGoTo = function(index) {
            if (index < 0 || index >= currentCarouselImages.length) return;
            currentCarouselIndex = index;
            updateCarouselDisplay();
        };

        let touchStartX = 0;
        let touchEndX = 0;

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) window.nextItem();
                else window.prevItem();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const imageWrapper = document.getElementById('carousel-image-wrapper');
            if (imageWrapper) {
                imageWrapper.addEventListener('touchstart', (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });

                imageWrapper.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    handleSwipe();
                }, { passive: true });
            }
        });

        const closeBtn = document.getElementById('close-modal');
        closeBtn.onclick = () => {
            document.getElementById('detail-modal-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
            currentModalDropCode = null;
        };
        
        // Klavye: Escape = kapat, ArrowLeft/Right = öğeler arası geçiş (filtre hassas)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeBtn.onclick();
            if (e.key === 'ArrowRight') window.nextItem();
            if (e.key === 'ArrowLeft') window.prevItem();
        });
        window.onload = fetchSheetData;
    </script>
</body>
</html>
